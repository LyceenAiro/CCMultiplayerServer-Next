<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC 联机服务器管理</title>
<style>
/* ===== CrossWorlds 科幻 HUD 主题 ===== */
:root {
  --bg:#070b16; --panel:#101a30; --line:#27405f; --line-hi:#3f6ea6;
  --fg:#dce8fa; --dim:#7f95b8;
  --cyan:#4fc8ff; --cyan-dim:rgba(79,200,255,.35);
  --orange:#ffa52e; --orange-hi:#ffc46b;
  --ok:#4fe08a; --bad:#ff5f6e;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; overflow:hidden; color:var(--fg);
  font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 550px at 85% -10%, rgba(79,200,255,.09), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(255,165,46,.05), transparent 55%),
    linear-gradient(160deg,#0a1122 0%,#070b16 55%,#05080f 100%);
  background-attachment:fixed;
}
body::before { /* 全息网格 */
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(79,200,255,.030) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(79,200,255,.030) 0 1px, transparent 1px 44px);
}
body::after { /* 扫描线 */
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
}

/* ===== 顶栏 ===== */
header {
  position:relative; z-index:1; height:52px; padding:0 18px;
  display:flex; align-items:center; gap:14px;
  background:linear-gradient(180deg, rgba(18,28,52,.92), rgba(11,18,36,.92));
  border-bottom:1px solid var(--line);
}
header::after { /* 底缘能量线 */
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
  background:linear-gradient(90deg, var(--orange), var(--cyan) 45%, transparent 80%);
}
header h1 { margin:0; font-size:15px; font-weight:700; letter-spacing:.16em; display:flex; align-items:center; }
header h1 .tick {
  width:10px; height:10px; margin-right:11px; transform:skewX(-18deg);
  background:linear-gradient(135deg, var(--orange-hi), var(--orange));
  box-shadow:0 0 9px rgba(255,165,46,.75);
  animation:tickPulse 2.6s ease-in-out infinite;
}
@keyframes tickPulse { 0%,100% { box-shadow:0 0 5px rgba(255,165,46,.45); } 50% { box-shadow:0 0 12px rgba(255,165,46,.95); } }
header .ver {
  color:var(--dim); font:11px/1 Consolas,monospace; letter-spacing:.08em;
  padding:4px 9px; border:1px solid var(--line); border-radius:2px; background:rgba(8,14,28,.7);
}
header .spacer { flex:1; }

main { position:relative; z-index:1; display:flex; height:calc(100vh - 52px); }

/* ===== 左侧玩家列表 ===== */
#listPanel {
  width:300px; flex:none; display:flex; flex-direction:column;
  border-right:1px solid var(--line); background:rgba(8,13,26,.55);
}
.searchWrap { padding:12px 12px 10px; border-bottom:1px solid rgba(39,64,95,.55); }
.searchWrap input { width:100%; }
#list { flex:1; overflow-y:auto; padding:10px 12px 14px; }
#list > .dim { padding:8px 2px; letter-spacing:.06em; }

.player {
  position:relative; cursor:pointer; margin-bottom:8px; padding:9px 12px;
  border:1px solid var(--line); border-left:3px solid transparent; border-radius:3px;
  background:linear-gradient(180deg, rgba(19,29,53,.72), rgba(12,19,37,.72));
  transition:border-color .12s ease, background .12s ease;
}
.player:hover { border-color:var(--line-hi); background:linear-gradient(180deg, rgba(26,39,70,.8), rgba(15,24,46,.8)); }
.player.sel {
  border-color:var(--cyan); border-left-color:var(--orange);
  background:linear-gradient(90deg, rgba(255,165,46,.10), rgba(79,200,255,.07) 45%, rgba(15,24,46,.85));
  box-shadow:0 0 0 1px rgba(79,200,255,.30), 0 0 18px rgba(79,200,255,.10);
}
.player .nm { font-weight:600; letter-spacing:.03em; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.player .sub { margin-top:3px; color:var(--dim); font-size:11px; letter-spacing:.03em; }

.badge {
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px;
  font-size:11px; letter-spacing:.10em; border-radius:2px; border:1px solid; white-space:nowrap;
}
.badge.on { color:var(--ok); border-color:rgba(79,224,138,.45); background:rgba(79,224,138,.08); }
.badge.on::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok); }
.badge.off { color:var(--dim); border-color:rgba(127,149,184,.30); background:rgba(127,149,184,.06); }
.badge.off::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--dim); opacity:.55; }

/* 1.78.x: 重置验证码面板（有活跃验证码时显示在玩家列表上方） */
#resetPanel { display:none; margin:10px 12px 0; padding:9px 12px 7px;
  border:1px solid rgba(255,165,46,.55); border-radius:3px;
  background:linear-gradient(180deg, rgba(255,165,46,.10), rgba(255,165,46,.04));
  box-shadow:0 0 14px rgba(255,165,46,.12); }
#resetPanel.on { display:block; }
#resetPanel .rcTitle { font-size:11px; letter-spacing:.12em; color:var(--orange-hi); margin-bottom:6px; }
#resetPanel .rcRow { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:12px; }
#resetPanel .rcName { color:var(--cyan); cursor:pointer; font-weight:600; }
#resetPanel .rcName:hover { text-decoration:underline; }
#resetPanel .rcCode { font:15px/1.25 Consolas,monospace; letter-spacing:.28em; color:var(--orange-hi);
  background:rgba(8,14,28,.85); border:1px solid var(--line-hi); border-radius:3px;
  padding:3px 6px 3px 10px; user-select:all; }
#resetPanel .rcExp { color:var(--dim); font-size:11px; margin-left:auto; }

/* 1.80.x: 边栏服务器状态（在线人数 / 实时流量，随 /players 轮询刷新） */
#statsBox { margin:10px 12px 0; padding:8px 12px 9px;
  border:1px solid var(--line); border-radius:3px;
  background:linear-gradient(180deg, rgba(19,29,53,.72), rgba(12,19,37,.72)); }
#statsBox .stRow { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:2px 0; }
#statsBox .stK { color:var(--dim); font-size:11px; letter-spacing:.12em; white-space:nowrap; }
#statsBox .stV { font:12px/1.45 Consolas,monospace; letter-spacing:.03em; text-align:right; white-space:nowrap; }
#statsBox .stV b { color:var(--cyan); font-weight:600; }
#statsBox .stV .up { color:var(--ok); }
#statsBox .stV .down { color:var(--orange-hi); }

/* ===== 右侧详情区 ===== */
#detail { flex:1; overflow-y:auto; padding:22px 28px 40px; }
#detail > * { max-width:1040px; }
#detail > .dim:only-child { margin-top:60px; text-align:center; letter-spacing:.12em; }
#detail > .panel, #detail > .grid2, #detail > h2, #detail > #msg { animation:panelIn .18s ease-out; }
@keyframes panelIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

h2 { margin:0 0 14px; font-size:19px; letter-spacing:.06em; display:flex; align-items:center; gap:12px; }

.panel {
  position:relative; margin-bottom:16px; padding:14px 18px 16px;
  background:linear-gradient(180deg, rgba(21,32,58,.82), rgba(12,19,37,.82));
  border:1px solid var(--line); border-radius:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 5px 20px rgba(0,0,0,.35);
}
.panel::before { /* 左上号角标 */
  content:""; position:absolute; left:-1px; top:-1px; width:14px; height:14px;
  border-left:2px solid var(--cyan); border-top:2px solid var(--cyan);
  border-top-left-radius:4px; opacity:.85; pointer-events:none;
}
.panel::after { /* 右下号角标 */
  content:""; position:absolute; right:-1px; bottom:-1px; width:14px; height:14px;
  border-right:2px solid var(--cyan); border-bottom:2px solid var(--cyan);
  border-bottom-right-radius:4px; opacity:.85; pointer-events:none;
}
.panel > b { /* 区块标题：斜块 + 大写科技感 */
  display:inline-flex; align-items:center; gap:9px;
  font-size:12px; font-weight:700; letter-spacing:.20em; color:var(--cyan);
}
.panel > b::before {
  content:""; width:8px; height:8px; transform:skewX(-18deg);
  background:linear-gradient(135deg, var(--orange-hi), var(--orange));
  box-shadow:0 0 7px rgba(255,165,46,.65);
}

table.kv { border-collapse:collapse; width:100%; margin-top:2px; }
table.kv td { padding:6px 18px 6px 0; vertical-align:top; }
table.kv tr + tr td { border-top:1px solid rgba(39,64,95,.35); }
table.kv td.k { width:72px; color:var(--dim); font-size:12px; letter-spacing:.08em; white-space:nowrap; padding-top:8px; }

.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }

/* ===== 按钮：切角 + 能量渐变 ===== */
button {
  height:30px; padding:0 16px; border:0; cursor:pointer;
  font:600 12px/1 "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing:.10em;
  color:#20130a; background:linear-gradient(180deg, var(--orange-hi), var(--orange));
  clip-path:polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  transition:filter .12s ease, transform .06s ease;
}
button:hover { filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,165,46,.35)); }
button:active { transform:translateY(1px); }
button:focus-visible { outline:1px solid var(--cyan); outline-offset:2px; }
button.ghost {
  color:var(--fg);
  background:linear-gradient(180deg, rgba(79,200,255,.13), rgba(79,200,255,.05));
  box-shadow:inset 0 0 0 1px var(--cyan-dim);
}
button.ghost:hover { filter:brightness(1.25) drop-shadow(0 0 8px rgba(79,200,255,.25)); }

/* ===== 输入控件 ===== */
input, select {
  height:30px; padding:0 10px;
  background:#0a1224; color:var(--fg);
  border:1px solid var(--line); border-radius:3px;
  font:13px/1 "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing:.02em;
  transition:border-color .12s ease, box-shadow .12s ease;
}
input:focus, select:focus {
  outline:none; border-color:var(--cyan);
  box-shadow:0 0 0 1px var(--cyan-dim), 0 0 14px rgba(79,200,255,.16);
}
input::placeholder { color:#506486; }
input[type=number] { font-family:Consolas,monospace; }
select { cursor:pointer; }
select option { background:#0b1426; }

/* ===== 消息条 ===== */
#msg {
  position:relative; margin:0 0 16px; padding:10px 14px 10px 38px;
  border:1px solid; border-radius:3px; display:none; white-space:pre-wrap; letter-spacing:.02em;
}
#msg.ok { display:block; background:rgba(79,224,138,.07); border-color:rgba(79,224,138,.40); color:var(--ok); }
#msg.ok::before { content:"✓"; position:absolute; left:14px; top:10px; font-weight:700; }
#msg.err { display:block; background:rgba(255,95,110,.07); border-color:rgba(255,95,110,.42); color:var(--bad); }
#msg.err::before { content:"✕"; position:absolute; left:14px; top:10px; font-weight:700; }

/* ===== 镜像存档 ===== */
.mirror {
  display:flex; align-items:center; gap:14px; padding:8px 14px; margin-bottom:8px;
  border:1px solid var(--line); border-radius:3px; background:rgba(9,15,30,.6);
  transition:border-color .12s ease;
}
.mirror:hover { border-color:var(--line-hi); }
.mirror .idx { color:var(--orange); font:700 12px/1 Consolas,monospace; letter-spacing:.06em; }

/* ===== 物品搜索下拉 ===== */
#itemResults {
  position:absolute; top:calc(100% + 6px); left:0; z-index:10; display:none;
  width:360px; max-height:280px; overflow-y:auto;
  background:#0b1428; border:1px solid var(--line-hi); border-radius:3px;
  box-shadow:0 12px 30px rgba(0,0,0,.65), 0 0 0 1px rgba(79,200,255,.12), 0 0 24px rgba(79,200,255,.10);
}
#itemResults .it { padding:8px 12px; cursor:pointer; border-bottom:1px solid rgba(39,64,95,.45); letter-spacing:.02em; }
#itemResults .it:last-child { border-bottom:0; }
#itemResults .it:hover { background:rgba(79,200,255,.10); }
#itemResults .it.nohit { color:var(--dim); cursor:default; pointer-events:none; }
#itemResults .it .id { margin-left:8px; color:var(--dim); font:11px/1 Consolas,monospace; }

.dim { color:var(--dim); font-size:12px; letter-spacing:.03em; }
.tip { border-bottom:1px dashed rgba(127,149,184,.65); cursor:help; transition:color .12s ease, border-color .12s ease; }
.tip:hover { color:var(--cyan); border-bottom-color:var(--cyan); }

/* ===== 装备属性悬浮窗 ===== */
#tooltip {
  position:fixed; z-index:99; display:none; min-width:190px; padding:12px 16px;
  background:linear-gradient(180deg,#0d1730,#0a1122);
  border:1px solid var(--cyan-dim); border-radius:3px; pointer-events:none; font-size:13px;
  box-shadow:0 12px 32px rgba(0,0,0,.7), 0 0 20px rgba(79,200,255,.12);
}
#tooltip .tname { font-weight:700; color:var(--orange-hi); letter-spacing:.04em; margin-bottom:2px; }
#tooltip .tmeta { color:var(--dim); font-size:11px; letter-spacing:.06em; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(39,64,95,.6); }
#tooltip .stat { display:flex; justify-content:space-between; gap:20px; padding:1px 0; }
#tooltip .stat .v { font-weight:600; font-family:Consolas,monospace; }
#tooltip .stat .v.up { color:var(--ok); }
#tooltip .stat .v.down { color:var(--bad); }

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#22395c; border-radius:5px; border:2px solid #070b16; }
::-webkit-scrollbar-thumb:hover { background:#31527f; }

/* ===== 3.0.3 布局整理：区块头 / 状态行 / 标签 / 双栏网格 ===== */
.grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; margin-bottom:16px; }
.grid2 > .panel { margin-bottom:0; height:100%; }

/* 区块标题：斜块 + 标题 + 右侧提示 + 渐隐分隔线（替代裸 <b> 标题） */
.phead { display:flex; align-items:center; gap:10px; margin:0 0 10px; }
.phead::after { content:""; flex:1; height:1px;
  background:linear-gradient(90deg, rgba(79,200,255,.28), rgba(79,200,255,.02)); }
.ptitle { display:inline-flex; align-items:center; gap:9px; white-space:nowrap;
  font-size:12px; font-weight:700; letter-spacing:.20em; color:var(--cyan); }
.ptitle::before { content:""; width:8px; height:8px; transform:skewX(-18deg);
  background:linear-gradient(135deg, var(--orange-hi), var(--orange));
  box-shadow:0 0 7px rgba(255,165,46,.65); }
.phint { color:var(--dim); font-size:11px; letter-spacing:.04em; white-space:nowrap; }
.panel.danger { border-color:rgba(255,95,110,.42); }
.panel.danger .ptitle { color:var(--bad); }
.panel.danger .ptitle::before { background:linear-gradient(135deg,#ff8e9f,#ff5f6e); box-shadow:0 0 7px rgba(255,95,110,.6); }
.panel.danger .phead::after { background:linear-gradient(90deg, rgba(255,95,110,.28), rgba(255,95,110,.02)); }

/* 状态行：标签 / 取值 / 右对齐操作按钮 */
.srow { display:flex; align-items:center; gap:12px; padding:8px 0; }
.srow + .srow { border-top:1px solid rgba(39,64,95,.35); }
.srow .sk { flex:none; width:72px; color:var(--dim); font-size:12px; letter-spacing:.10em; }
.srow .sv { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
.srow .sact { flex:none; margin-left:auto; display:flex; gap:8px; }

/* 状态标签（替代行内 style 的红/绿文字） */
.tag { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; white-space:nowrap;
  font-size:11px; letter-spacing:.06em; border:1px solid; border-radius:2px; }
.tag.ok { color:var(--ok); border-color:rgba(79,224,138,.45); background:rgba(79,224,138,.08); }
.tag.bad { color:var(--bad); border-color:rgba(255,95,110,.45); background:rgba(255,95,110,.08); }
.tag.warn { color:var(--orange-hi); border-color:rgba(255,165,46,.5); background:rgba(255,165,46,.08); }
.tag.dim { color:var(--dim); border-color:rgba(127,149,184,.30); background:rgba(127,149,184,.06); }

/* 验证码等短代码：等宽 + 可整体选中 */
b.code { padding:2px 8px; border:1px solid var(--line-hi); border-radius:3px; user-select:all;
  font:13px/1.3 Consolas,monospace; letter-spacing:.22em; color:var(--orange-hi); background:rgba(8,14,28,.85); }

/* 按钮补充：小号 / 危险 */
button.sm { height:26px; padding:0 11px; font-size:11px; letter-spacing:.08em; }
button.danger { color:#ffe3e7; background:linear-gradient(180deg, #7c2a36, #5c1f28);
  box-shadow:inset 0 0 0 1px rgba(255,95,110,.55); }
button.danger:hover { filter:brightness(1.18) drop-shadow(0 0 8px rgba(255,95,110,.35)); }

.empty { padding:12px 4px; color:var(--dim); font-size:12px; letter-spacing:.06em; }
.mirrorList { display:flex; flex-direction:column; gap:8px; }
.mirrorList .mirror { margin-bottom:0; }

/* 左栏分组标题 */
.sideHead { display:flex; align-items:center; gap:8px; padding:12px 12px 4px; }
.sideHead .t { color:var(--cyan); font-size:11px; font-weight:700; letter-spacing:.20em; white-space:nowrap; }
.sideHead .t::before { content:""; display:inline-block; width:7px; height:7px; margin-right:8px;
  transform:skewX(-18deg); background:linear-gradient(135deg, var(--orange-hi), var(--orange)); }
.sideHead .c { margin-left:auto; color:var(--dim); font:11px/1 Consolas,monospace; letter-spacing:.06em; }

.player .sub { display:flex; flex-wrap:wrap; align-items:center; gap:3px 8px; }

@media (max-width: 1180px) { .grid2 { grid-template-columns:1fr; } }
@media (max-width: 920px) { #listPanel { width:240px; } #detail { padding:16px 18px 32px; } }
</style>
</head>
<body>
<header>
  <h1><span class="tick"></span>CC 联机服务器管理</h1>
  <span class="ver" id="verInfo"></span>
  <span class="spacer"></span>
  <button class="ghost" onclick="refreshAll()">⟳ 刷新</button>
</header>
<main>
  <div id="listPanel">
    <div class="sideHead"><span class="t">服务器状态</span></div>
    <div id="statsBox">
      <div class="stRow"><span class="stK">玩家 在线/上限</span><span class="stV tip" id="stOnline">—</span></div>
      <div class="stRow"><span class="stK">流量 <span class="up">↑</span>/<span class="down">↓</span></span><span class="stV tip" id="stTraffic">—</span></div>
    </div>
    <div id="resetPanel"></div>
    <div class="sideHead"><span class="t">玩家列表</span><span class="c" id="listCount">—</span></div>
    <div class="searchWrap"><input id="playerSearch" placeholder="搜索玩家（模糊）…（回车打开第一个）" oninput="renderList()"></div>
    <div id="list"><div class="dim">加载中…</div></div>
  </div>
  <div id="detail"><div class="dim">← 选择左侧玩家查看详情</div></div>
</main>
<div id="tooltip"></div>
<script>
var TOKEN = localStorage.getItem('mpAdminToken') || '';
var players = [];
var current = null;
var detail = null;
var itemdb = [];
var teleports = [];
var pickedItem = null;
var godState = {}; // 玩家名 -> 无敌模式最后已知状态（本页内存，仅会话）
var tradeLockHours = 48; // 服务器配置的交易锁定时长（/players 下发，0 = 限制已关闭）

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'x-admin-token': TOKEN }, opts.headers || {});
  if (opts.body && typeof opts.body !== 'string') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  var r = await fetch('/admin/api' + path, opts);
  var j = await r.json().catch(function(){ return { ok:false, msg:'响应解析失败' }; });
  if (r.status === 401) { if (!opts.quiet) askToken(true); throw new Error('unauthorized'); }
  return j;
}
function askToken(force) {
  var t = prompt(force ? 'Token 错误，请重新输入管理令牌 (adminToken)：' : '请输入管理令牌 (adminToken)：', TOKEN);
  if (t !== null) { TOKEN = t.trim(); localStorage.setItem('mpAdminToken', TOKEN); refreshAll(); }
}
function showMsg(ok, text) {
  var m = document.getElementById('msg');
  if (!m) return;
  m.className = ok ? 'ok' : 'err';
  m.textContent = text;
}
function fmtTime(ts) { if (!ts) return '—'; return new Date(ts).toLocaleString('zh-CN'); }
function fmtPlaytime(s) {
  if (!s) return '0 小时 0 分';
  return Math.floor(s / 3600) + ' 小时 ' + Math.floor((s % 3600) / 60) + ' 分';
}
// 交易锁定剩余时间：'47 小时 23 分' / '58 分钟'
function fmtLockRemain(ms) {
  var totalMin = Math.ceil(ms / 60000);
  var h = Math.floor(totalMin / 60), m = totalMin % 60;
  if (h <= 0) return m + ' 分钟';
  return m > 0 ? (h + ' 小时 ' + m + ' 分') : (h + ' 小时');
}
function lockRemainMs(p) {
  var u = Number(p && p.tradeLockUntil) || 0;
  return u > Date.now() ? (u - Date.now()) : 0;
}
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// 3.0.3: 一键复制（重置验证码复制后口头/私聊核对更方便），按钮短暂显示"已复制"
function copyText(text, btn) {
  var t = String(text);
  var flash = function () {
    if (!btn) return;
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function () { btn.textContent = old; }, 1200);
  };
  var fallback = function () {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash(); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(flash, fallback);
  } else fallback();
}

// 1.80.x: 边栏服务器状态 —— 在线人数与服务器实时流量（随 /players 轮询每 3s 刷新；
// 流量值为服务器端最近 1 秒窗口的字节速率）。流量的 1 分钟平均值写进 data-tip，
// 由下方通用悬浮窗（#tooltip）在鼠标悬停时显示。
function fmtBps(n) {
  n = Math.max(0, Number(n) || 0);
  if (n < 1024) return Math.round(n) + ' B/s';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB/s';
  return (n / 1048576).toFixed(2) + ' MB/s';
}
function renderStats(st) {
  if (!st) return;
  var onEl = document.getElementById('stOnline');
  if (onEl) {
    // 0.2.6: 在线/上限（config.maxPlayers）——旧版显示的是 注册账号总数，
    // 管理员会误以为容量被改成了 51。占用数与登录门同一来源（含 bot）。
    var occ = Number(st.occupancy);
    if (!isFinite(occ)) occ = Number(st.online) || 0;
    var cap = Number(st.maxPlayers);
    if (!isFinite(cap) || cap <= 0) cap = Number(st.total) || 0;
    var onHtml = '<b>' + occ + '</b> / ' + cap;
    if (onEl.innerHTML !== onHtml) onEl.innerHTML = onHtml;
    var tip = '<div class="tname">玩家占用</div>' +
      '<div class="stat"><span>当前在线（含 bot，登录门同口径）</span><span class="v">' + occ + '</span></div>' +
      '<div class="stat"><span>maxPlayers 上限</span><span class="v">' + cap + '</span></div>' +
      '<div class="stat"><span>注册账号总数（不含 bot）</span><span class="v">' + (Number(st.total) || 0) + '</span></div>' +
      '<div class="stat"><span>列表内在线账号</span><span class="v">' + (Number(st.online) || 0) + '</span></div>';
    if (onEl.getAttribute('data-tip') !== tip) onEl.setAttribute('data-tip', tip);
  }
  var tfEl = document.getElementById('stTraffic');
  if (tfEl) {
    var tfHtml = '<span class="up">↑</span> <b>' + fmtBps(st.upBps) + '</b> <span class="down">↓</span> <b>' + fmtBps(st.downBps) + '</b>';
    if (tfEl.innerHTML !== tfHtml) tfEl.innerHTML = tfHtml;
    var tip = '<div class="tname">服务器流量 · 最近 1 分钟平均</div>' +
      '<div class="stat"><span><span class="up">↑</span> 上传（服务器 → 客户端）</span><span class="v up">' + fmtBps(st.upAvgBps) + '</span></div>' +
      '<div class="stat"><span><span class="down">↓</span> 下载（客户端 → 服务器）</span><span class="v down">' + fmtBps(st.downAvgBps) + '</span></div>';
    if (tfEl.getAttribute('data-tip') !== tip) tfEl.setAttribute('data-tip', tip);
  }
}

async function refreshAll() {
  try {

function renderList() {
  var el0 = document.getElementById('list');
  var st0 = el0 ? el0.scrollTop : 0; // 保留滚动位置，热更新不打断浏览
  renderListInner();

}

// 1.78.x: 活跃的重置验证码面板 —— 客户端点"重置密码"后验证码出现在这里，
// 管理员读给玩家（带外确认身份）。仅在有未过期验证码时显示；倒计时随轮询刷新。
function renderResetPanel() {
  var el = document.getElementById('resetPanel');
  if (!el) return;
  var now = Date.now();
  var rows = [];
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.reset && p.reset.code && Number(p.reset.expiresAt) > now) rows.push(p);
  }
  if (!rows.length) { el.className = ''; el.innerHTML = ''; return; }
  el.className = 'on';
  var html = '<div class="rcTitle">🔑 待使用的密码重置验证码（告知对应玩家）</div>';
  html += rows.map(function(p){
    var mins = Math.max(1, Math.ceil((Number(p.reset.expiresAt) - now) / 60000));
    return '<div class="rcRow"><span class="rcName" onclick="loadDetail(\'' + encodeURIComponent(p.name) + '\')">' + esc(p.name) + '</span>' +
      '<span class="rcCode">' + esc(p.reset.code) + '</span>' +
      '<button class="ghost sm" onclick="copyText(\'' + esc(p.reset.code) + '\', this)">复制</button>' +
      '<span class="rcExp">剩约 ' + mins + ' 分钟</span></div>';
  }).join('');
  el.innerHTML = html;
}
function renderListInner() {
  var el = document.getElementById('list');
  var qEl = document.getElementById('playerSearch');
  var q = qEl ? qEl.value.trim() : '';
  var shown = players;
  if (q) {
    var scored = [];
    for (var i = 0; i < players.length; i++) {
      var s = fuzzyScore(players[i].name, q);
      if (s >= 0) scored.push({ p: players[i], score: s });
    }
    scored.sort(function(a, b){ return b.score - a.score; });
    shown = scored.map(function(x){ return x.p; });
  }
  var cnt = document.getElementById('listCount');
  if (cnt) cnt.textContent = q ? (shown.length + ' / ' + players.length) : String(players.length);
  if (!shown.length) { el.innerHTML = '<div class="dim">' + (q ? '无匹配玩家' : '暂无玩家') + '</div>'; return; }
  el.innerHTML = shown.map(function(p){
    var lm = lockRemainMs(p);
    var lockHtml = lm > 0 ? ' <span class="tag bad">🔒 交易锁定 ' + fmtLockRemain(lm) + '</span>' : '';
    // 1.78.x: login brute-force lockout badge (wrong-password lock)
    if (Number(p.loginLockedUntil) > Date.now()) lockHtml += ' <span class="tag bad">🔒 登录锁定</span>';
    return '<div class="player' + (p.name === current ? ' sel' : '') + '" onclick="loadDetail(\'' + encodeURIComponent(p.name) + '\')">' +
      '<div class="nm">' + esc(p.name) + ' <span class="badge ' + (p.online ? 'on' : 'off') + '">' + (p.online ? '在线' : '离线') + '</span></div>' +
      '<div class="sub">存档更新：' + fmtTime(p.updatedAt) + lockHtml + '</div></div>';
  }).join('');
}

// ---- 列表排序与状态热更新（静默轮询，不触碰详情区输入） ----
// 排序：在线玩家在前；同组内按存档更新时间，新的在前
function sortPlayers() {
  players.sort(function(a, b){
    var onA = a.online ? 1 : 0, onB = b.online ? 1 : 0;
    if (onA !== onB) return onB - onA;
    var tA = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
    var tB = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
    if (tA !== tB) return tB - tA;
    return String(a.name).localeCompare(String(b.name));
  });
}
// 列表内容指纹：内容没变就不重建 DOM，避免闪烁/打断
function listKey() {
  // 锁定时长按小时粒度入指纹：到期/新锁定会触发重绘，分钟级流逝不打断浏览
  // 1.78.x: 重置验证码按分钟粒度入指纹（出现/消失/到期都会触发重绘倒计时）
  return players.map(function(p){
    return p.name + (p.online ? '1' : '0') + (p.updatedAt || '') +
      (lockRemainMs(p) > 0 ? 'L' + Math.ceil(lockRemainMs(p) / 3600000) : '') +
      (p.reset ? 'R' + p.reset.code + Math.ceil((Number(p.reset.expiresAt) - Date.now()) / 60000) : '') +
      (Number(p.resetLockedUntil) > Date.now() ? 'K' : '') +
      (Number(p.loginLockedUntil) > Date.now() ? 'G' : '');
  }).join('|');
}
// 仅就地更新详情页头部的在线徽章（不重绘详情，不影响正在输入的内容）
function updateDetailBadge() {
  if (!current) return;
  var badge = document.querySelector('#detail h2 .badge');
  if (!badge) return;
  for (var i = 0; i < players.length; i++) {
    if (players[i].name !== current) continue;
    badge.className = 'badge ' + (players[i].online ? 'on' : 'off');
    badge.textContent = players[i].online ? '在线' : '离线';
    return;
  }
}
var polling = false;
async function pollPlayers() {
  if (polling || !TOKEN || document.hidden) return; // 请求进行中 / 未登录 / 标签页隐藏时跳过
  polling = true;
  try {
    var j = await api('/players', { quiet: true });
    var before = listKey();
    players = j.players || [];
    if (typeof j.tradeLockHours === 'number') tradeLockHours = j.tradeLockHours;
    renderStats(j.stats); // 流量每轮都在变，不入 listKey 指纹，直接热更新
    sortPlayers();
    if (listKey() !== before) { renderList(); updateDetailBadge(); }
  } catch (e) { /* 轮询静默失败，绝不打断当前操作 */ }
  polling = false;
}

async function loadDetail(encName) {
  var name = decodeURIComponent(encName);

  renderList();
  var j = await api('/player/' + encodeURIComponent(name));
  if (!j.ok) { showMsg(false, j.msg); return; }

}

// 3.0.3: 只返回"标签 + 取值"两个单元格（不再自带 <tr>），每行可排两组装备槽位
function eqRow(eq, label, slot) {

async function switchMirror(i) {

  var j = await api('/player/' + encodeURIComponent(current) + '/switchMirror', { method: 'POST', body: { index: i } });
  showMsg(j.ok, j.msg);
  if (j.ok) loadDetail(encodeURIComponent(current));
}
// 解除当前玩家的交易锁定（服务器存档死线为权威；在线玩家会被实时推送解除）
async function clearTradeLock() {
  if (!current) return;
  if (!confirm('确定解除玩家「' + current + '」的交易锁定？\n解除后其可立即交易。')) return;
  var j = await api('/player/' + encodeURIComponent(current) + '/clearTradeLock', { method: 'POST' });
  showMsg(j.ok, j.msg || (j.ok ? '交易锁定已解除' : '操作失败'));

async function give(kind, inputId) {
  var amount = parseInt(document.getElementById(inputId).value, 10);
  if (!amount || amount <= 0) { showMsg(false, '请输入有效数量'); return; }
  var j = await api('/online/' + encodeURIComponent(current) + '/' + kind, { method: 'POST', body: { amount: amount } });
  showMsg(j.ok, j.ok ? ('已执行' + (j.msg ? '：' + j.msg : '')) : j.msg);
}
function fuzzyScore(name, q) {
  name = name.toLowerCase(); q = q.toLowerCase();
  var at = name.indexOf(q);
  if (at >= 0) return 100 - at;
  var qi = 0, gaps = 0;
  for (var i = 0; i < name.length && qi < q.length; i++) { if (name[i] === q[qi]) qi++; else gaps++; }
  return qi === q.length ? 50 - gaps * 0.1 : -1;
}
function searchItems() {
  var q = document.getElementById('itemSearch').value.trim();
  var box = document.getElementById('itemResults');
  pickedItem = null;
  if (!q) { box.style.display = 'none'; return; }
  var scored = [];
  for (var i = 0; i < itemdb.length; i++) {
    var it = itemdb[i], best = -1;
    var names = Object.keys(it.names).map(function(k){ return it.names[k]; });
    for (var n = 0; n < names.length; n++) { var s = fuzzyScore(names[n], q); if (s > best) best = s; }
    var score = Math.max(best, String(it.id) === q ? 200 : -1);
    if (score >= 0) scored.push({ it: it, score: score });
  }
  scored.sort(function(a, b){ return b.score - a.score; });
  var top = scored.slice(0, 20);
  if (!top.length) { box.innerHTML = '<div class="it nohit">无匹配物品（可继续输入）</div>'; box.style.display = 'block'; return; }
  box.innerHTML = top.map(function(x){
    var nm = x.it.names.zh_CN || x.it.names.zh_TW || x.it.names.en_US || x.it.names[Object.keys(x.it.names)[0]];
    return '<div class="it" onmousedown="pickItem(' + x.it.id + ', \'' + String(nm).replace(/'/g, "\\'") + '\')"><span class="tip" data-item="' + x.it.id + '">' + esc(nm) + '</span><span class="id">#' + x.it.id + '</span></div>';
  }).join('');
  box.style.display = 'block';
}
function pickItem(id, name) {
  pickedItem = id;
  document.getElementById('itemSearch').value = name + ' #' + id;
  document.getElementById('itemResults').style.display = 'none';
}
async function giveItem() {
  if (pickedItem === null) { showMsg(false, '请先从搜索结果中选定一个物品'); return; }
  var amount = parseInt(document.getElementById('itemAmt').value, 10) || 1;
  if (!confirm('确定给予 ' + current + ' 物品 #' + pickedItem + ' ×' + amount + '？')) return;

  showMsg(j.ok, j.ok ? '已给予' + (j.msg ? '：' + j.msg : '') : j.msg);
}
async function toggleGod() {
  var next = !godState[current];
  var j = await api('/online/' + encodeURIComponent(current) + '/godMode', { method: 'POST', body: { on: next } });
  if (j.ok) {
    godState[current] = next;
    showMsg(true, next ? '无敌模式已开启：该玩家受到的伤害均为 0（直接击杀除外）' : '无敌模式已关闭');
    var btn = document.getElementById('godBtn');
    if (btn) { btn.textContent = next ? '🛡 无敌模式：开' : '🛡 无敌模式：关'; btn.className = next ? '' : 'ghost'; }

}

// ---- 装备属性悬浮窗 ----
var TYPE_LABEL = { EQUIP: '装备', CONS: '消耗品', TRADE: '交易素材' };
var EQT_LABEL = { HEAD: '头部', ARM: '手臂', TORSO: '躯干', FEET: '足部' };
var ELEM_LABEL = ['火', '冰', '雷', '波']; // elemFactor 顺序: heat/cold/shock/wave
function findItem(id) {
  for (var i = 0; i < itemdb.length; i++) if (itemdb[i].id === id) return itemdb[i];
  return null;
}
function tooltipHtml(it) {
  var nm = it.names.zh_CN || it.names.zh_TW || it.names.en_US || it.names[Object.keys(it.names)[0]];
  var h = '<div class="tname">' + esc(nm) + ' <span class="dim">#' + it.id + '</span></div>';
  var meta = [];
  if (it.type) meta.push(TYPE_LABEL[it.type] || it.type);
  if (it.equipType) meta.push(EQT_LABEL[it.equipType] || it.equipType);
  if (it.level) meta.push('Lv.' + it.level);
  if (meta.length) h += '<div class="tmeta">' + meta.join(' · ') + '</div>';
  var pr = it.params || {};
  var rows = [['生命', pr.hp], ['攻击', pr.attack], ['防御', pr.defense], ['专注', pr.focus]];
  var any = false;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i][1] == null) continue;
    any = true;
    h += '<div class="stat"><span>' + rows[i][0] + '</span><span class="v up">+' + rows[i][1] + '</span></div>';
  }
  if (pr.elemFactor) {
    for (var e = 0; e < 4; e++) {
      var pct = Math.round((1 - pr.elemFactor[e]) * 100);
      if (!pct) continue;
      any = true;
      var up = pct > 0;
      h += '<div class="stat"><span>' + ELEM_LABEL[e] + '抗性</span><span class="v ' + (up ? 'up' : 'down') + '">' + (up ? '+' : '') + pct + '%</span></div>';
    }
  }
  if (!any) h += '<div class="dim">无属性加成</div>';
  return h;
}
var tipEl = null;
document.addEventListener('mouseover', function(ev){
  var t = ev.target && ev.target.closest ? ev.target.closest('.tip') : null;
  tipEl = t;
  var box = document.getElementById('tooltip');
  if (!t) { box.style.display = 'none'; return; }
  // 1.80.x: 通用文本悬浮窗 —— data-tip 直接携带 HTML 内容（如边栏流量的 1 分钟平均），
  // 不走物品查询。
  var tipHtml = t.getAttribute('data-tip');
  if (tipHtml) { box.innerHTML = tipHtml; box.style.display = 'block'; return; }
  var id = parseInt(t.getAttribute('data-item'), 10);
  var it = findItem(id);
  if (!it) { box.style.display = 'none'; return; }
  box.innerHTML = tooltipHtml(it);
  box.style.display = 'block';
});
document.addEventListener('mousemove', function(ev){
  var box = document.getElementById('tooltip');
  if (!tipEl || box.style.display !== 'block') return;
  var w = box.offsetWidth, hgt = box.offsetHeight;
  var x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > window.innerWidth - 8) x = ev.clientX - w - 10;
  if (y + hgt > window.innerHeight - 8) y = ev.clientY - hgt - 10;
  box.style.left = x + 'px';
  box.style.top = y + 'px';
});

if (!TOKEN) askToken(false); else refreshAll();
setInterval(pollPlayers, 3000); // 每 3 秒静默同步在线状态与列表顺序
